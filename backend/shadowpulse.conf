[SYSTEM]
debug = False
log_level = INFO
data_retention_days = 30
max_log_size = 100MB
backup_enabled = True

[NETWORK]
interface = auto
monitor_mode = False
capture_buffer_size = 65536
scan_interval = 300
network_range = auto
timeout = 5

[DETECTORS]
arp_spoof_enabled = True
dhcp_spoofing_enabled = True
dns_spoof_enabled = True
http_injection_enabled = True
icmp_redirect_enabled = True
rogue_access_enabled = True
ssl_strip_enabled = True

[ALERTS]
severity_threshold = medium
email_notifications = True
sms_notifications = False
webhook_url = 
alert_cooldown = 60

[DATABASE]
type = sqlite
path = shadowpulse.db
pool_size = 10
timeout = 30

[BASELINES]
# Comma-separated explicit baselines. Leave empty to learn conservatively.
trusted_dhcp_servers =
trusted_dns_servers =
# JSON: [{"bssid": "aa:bb:cc:dd:ee:ff", "ssid": "CorpWiFi"}]
authorized_aps = []

[API]
host = 0.0.0.0
port = 5000
secret_key = change_this_secret_key
cors_enabled = True
rate_limit = 1000

